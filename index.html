<!-- INICIO DE SESIÓN -->
<div id="login" class="login-container">
  <div class="login-card">

    <h1>Feria Aniversario de la Capital</h1>
    <p>Acceso al Registro de Emprendedores</p>

    <label>Usuario</label>
    <input
      type="text"
      id="usuario"
      placeholder="Ingrese su usuario"
    >

    <label>Contraseña</label>
    <input
      type="password"
      id="contrasena"
      placeholder="Ingrese su contraseña"
    >

    <button onclick="iniciarSesion()">
      Ingresar
    </button>

    <div id="errorLogin" class="error-login"></div>

  </div>
</div>


<!-- CAMBIO OBLIGATORIO DE CONTRASEÑA -->
<div id="cambioContrasena" class="login-container" style="display:none;">

  <div class="login-card">

    <h1>Cambiar contraseña</h1>

    <p>
      Por seguridad, debe crear una nueva contraseña
      antes de continuar.
    </p>

    <label>Nueva contraseña</label>

    <input
      type="password"
      id="nuevaContrasena"
      placeholder="Nueva contraseña"
    >

    <label>Confirmar nueva contraseña</label>

    <input
      type="password"
      id="confirmarContrasena"
      placeholder="Repita la nueva contraseña"
    >

    <button onclick="guardarNuevaContrasena()">
      Guardar nueva contraseña
    </button>

    <div id="errorCambio" class="error-login"></div>

  </div>

</div>
