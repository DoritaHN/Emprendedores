<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Emprendedores</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f7;
      color: #263238;
    }

    header {
      background: #0f766e;
      color: white;
      padding: 24px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      opacity: 0.9;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    h2 {
      color: #0f766e;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    .campo-completo {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    textarea {
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #0f766e;
      box-shadow: 0 0 0 2px rgba(15,118,110,0.1);
    }

    .botones {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .btn-guardar {
      background: #0f766e;
      color: white;
    }

    .btn-guardar:hover {
      background: #0b5f59;
    }

    .btn-limpiar {
      background: #e5e7eb;
      color: #333;
    }

    .btn-exportar {
      background: #166534;
      color: white;
      margin-bottom: 16px;
    }

    .btn-exportar:hover {
      background: #14532d;
    }

    .contador {
      display: inline-block;
      background: #ccfbf1;
      color: #115e59;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 16px;
      margin-right: 10px;
    }

    .buscador {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .tabla-contenedor {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #0f766e;
      color: white;
      text-align: left;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    tr:hover {
      background: #f0fdfa;
    }

    .btn-editar {
      background: #f59e0b;
      color: white;
      margin-right: 5px;
      margin-bottom: 5px;
    }

    .btn-eliminar {
      background: #dc2626;
      color: white;
    }

    .mensaje-vacio {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    @media(max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .campo-completo {
        grid-column: auto;
      }

      header h1 {
        font-size: 22px;
      }

      .container {
        width: 96%;
      }

      th,
      td {
        font-size: 13px;
        padding: 9px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Control de Emprendedores</h1>
  <p>Registro de fichas de emprendedores</p>
</header>

<div class="container">

  <div class="card">
    <h2>Ficha del emprendedor</h2>

    <form id="formEmprendedor">

      <input type="hidden" id="indiceEditar">

      <div class="form-grid">

        <div class="campo">
          <label>Nombre completo *</label>
          <input
            type="text"
            id="nombre"
            placeholder="Ej. María López"
            required
          >
        </div>

        <div class="campo">
          <label>Número de identidad</label>
          <input
            type="text"
            id="identidad"
            maxlength="15"
            placeholder="0000-0000-00000"
          >
        </div>

        <div class="campo">
          <label>Teléfono *</label>
          <input
            type="tel"
            id="telefono"
            maxlength="10"
            placeholder="0000-00-00"
            required
          >
        </div>

        <div class="campo">
          <label>Ciudad o aldea</label>
          <input
            type="text"
            id="municipio"
            placeholder="Ej. Tegucigalpa"
          >
        </div>

        <div class="campo">
          <label>Colonia</label>
          <input
            type="text"
            id="colonia"
            placeholder="Ej. Colonia Kennedy"
          >
        </div>

        <div class="campo">
          <label>Nombre del emprendimiento *</label>
          <input
            type="text"
            id="emprendimiento"
            placeholder="Ej. Dulces María"
            required
          >
        </div>

        <div class="campo">
          <label>Actividad económica</label>
          <input
            type="text"
            id="rubro"
            placeholder="Ej. Alimentos, comercio, artesanía..."
          >
        </div>

        <div class="campo">
          <label>Fecha de registro</label>
          <input
            type="date"
            id="fecha"
          >
        </div>

        <div class="campo campo-completo">
          <label>Observaciones</label>
          <textarea
            id="observaciones"
            placeholder="Escribe aquí información adicional..."
          ></textarea>
        </div>

      </div>

      <div class="botones">

        <button
          type="submit"
          class="btn-guardar"
          id="btnGuardar"
        >
          Guardar ficha
        </button>

        <button
          type="button"
          class="btn-limpiar"
          onclick="limpiarFormulario()"
        >
          Limpiar
        </button>

      </div>

    </form>
  </div>

  <div class="card">

    <h2>Emprendedores registrados</h2>

    <div class="contador" id="contador">
      Total: 0 emprendedores
    </div>

    <button
      type="button"
      class="btn-exportar"
      onclick="exportarExcel()"
    >
      Exportar a Excel
    </button>

    <input
      type="text"
      id="buscador"
      class="buscador"
      placeholder="Buscar por nombre o emprendimiento..."
      oninput="mostrarEmprendedores()"
    >

    <div class="tabla-contenedor">

      <table>

        <thead>
          <tr>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Emprendimiento</th>
            <th>Actividad económica</th>
            <th>Ciudad o aldea</th>
            <th>Colonia</th>
            <th>Fecha de registro</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody id="tablaEmprendedores"></tbody>

      </table>

    </div>

  </div>

</div>

<script>
  let emprendedores =
    JSON.parse(localStorage.getItem("emprendedores")) || [];

  const formulario =
    document.getElementById("formEmprendedor");

  function fechaHoy() {
    const hoy = new Date();
    const anio = hoy.getFullYear();
    const mes = String(hoy.getMonth() + 1).padStart(2, "0");
    const dia = String(hoy.getDate()).padStart(2, "0");
    return `${anio}-${mes}-${dia}`;
  }

  function colocarFechaActual() {
    const campoFecha = document.getElementById("fecha");

    if (!campoFecha.value) {
      campoFecha.value = fechaHoy();
    }
  }

  colocarFechaActual();

  // FORMATO AUTOMÁTICO DE IDENTIDAD
  const identidadInput = document.getElementById("identidad");

  identidadInput.addEventListener("input", function() {

    let numeros = this.value.replace(/\D/g, "").slice(0, 13);

    let formato = "";

    if (numeros.length <= 4) {
      formato = numeros;
    } else if (numeros.length <= 8) {
      formato =
        numeros.slice(0, 4) +
        "-" +
        numeros.slice(4);
    } else {
      formato =
        numeros.slice(0, 4) +
        "-" +
        numeros.slice(4, 8) +
        "-" +
        numeros.slice(8, 13);
    }

    this.value = formato;
  });

  // FORMATO AUTOMÁTICO DE TELÉFONO
  const telefonoInput = document.getElementById("telefono");

  telefonoInput.addEventListener("input", function() {

    let numeros = this.value.replace(/\D/g, "").slice(0, 8);

    let formato = "";

    if (numeros.length <= 4) {
      formato = numeros;
    } else if (numeros.length <= 6) {
      formato =
        numeros.slice(0, 4) +
        "-" +
        numeros.slice(4);
    } else {
      formato =
        numeros.slice(0, 4) +
        "-" +
        numeros.slice(4, 6) +
        "-" +
        numeros.slice(6, 8);
    }

    this.value = formato;
  });

  formulario.addEventListener("submit", function(event) {

    event.preventDefault();

    const indiceEditar =
      document.getElementById("indiceEditar").value;

    const emprendedor = {
      nombre:
        document.getElementById("nombre").value.trim(),

      identidad:
        document.getElementById("identidad").value.trim(),

      telefono:
        document.getElementById("telefono").value.trim(),

      municipio:
        document.getElementById("municipio").value.trim(),

      colonia:
        document.getElementById("colonia").value.trim(),

      emprendimiento:
        document.getElementById("emprendimiento").value.trim(),

      rubro:
        document.getElementById("rubro").value.trim(),

      fecha:
        document.getElementById("fecha").value,

      observaciones:
        document.getElementById("observaciones").value.trim()
    };

    if (indiceEditar === "") {
      emprendedores.push(emprendedor);
      alert("Emprendedor registrado correctamente.");
    } else {
      emprendedores[indiceEditar] = emprendedor;
      alert("Ficha actualizada correctamente.");
    }

    guardarDatos();
    limpiarFormulario();
    mostrarEmprendedores();
  });

  function guardarDatos() {
    localStorage.setItem(
      "emprendedores",
      JSON.stringify(emprendedores)
    );
  }

  function mostrarEmprendedores() {

    const tabla =
      document.getElementById("tablaEmprendedores");

    const busqueda =
      document.getElementById("buscador")
      .value
      .toLowerCase();

    tabla.innerHTML = "";

    const resultados =
      emprendedores.filter(function(e) {
        return (
          (e.nombre || "").toLowerCase().includes(busqueda) ||
          (e.emprendimiento || "").toLowerCase().includes(busqueda)
        );
      });

    if (resultados.length === 0) {

      tabla.innerHTML = `
        <tr>
          <td colspan="8" class="mensaje-vacio">
            No hay emprendedores registrados.
          </td>
        </tr>
      `;

    } else {

      resultados.forEach(function(e) {

        const indiceReal =
          emprendedores.indexOf(e);

        const fila =
          document.createElement("tr");

        fila.innerHTML = `
          <td>${e.nombre || "-"}</td>
          <td>${e.telefono || "-"}</td>
          <td>${e.emprendimiento || "-"}</td>
          <td>${e.rubro || "-"}</td>
          <td>${e.municipio || "-"}</td>
          <td>${e.colonia || "-"}</td>
          <td>${e.fecha || "-"}</td>
          <td>
            <button
              class="btn-editar"
              onclick="editarEmprendedor(${indiceReal})"
            >
              Editar
            </button>

            <button
              class="btn-eliminar"
              onclick="eliminarEmprendedor(${indiceReal})"
            >
              Eliminar
            </button>
          </td>
        `;

        tabla.appendChild(fila);

      });

    }

    document.getElementById("contador").textContent =
      "Total: " +
      emprendedores.length +
      " emprendedores";
  }

  function editarEmprendedor(indice) {

    const e = emprendedores[indice];

    document.getElementById("nombre").value =
      e.nombre || "";

    document.getElementById("identidad").value =
      e.identidad || "";

    document.getElementById("telefono").value =
      e.telefono || "";

    document.getElementById("municipio").value =
      e.municipio || "";

    document.getElementById("colonia").value =
      e.colonia || "";

    document.getElementById("emprendimiento").value =
      e.emprendimiento || "";

    document.getElementById("rubro").value =
      e.rubro || "";

    document.getElementById("fecha").value =
      e.fecha || fechaHoy();

    document.getElementById("observaciones").value =
      e.observaciones || "";

    document.getElementById("indiceEditar").value =
      indice;

    document.getElementById("btnGuardar").textContent =
      "Actualizar ficha";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  function eliminarEmprendedor(indice) {

    const confirmar =
      confirm("¿Deseas eliminar este emprendedor?");

    if (!confirmar) {
      return;
    }

    emprendedores.splice(indice, 1);

    guardarDatos();
    mostrarEmprendedores();
  }

  function limpiarFormulario() {

    formulario.reset();

    document.getElementById("indiceEditar").value = "";

    document.getElementById("btnGuardar").textContent =
      "Guardar ficha";

    colocarFechaActual();

    document.getElementById("nombre").focus();
  }

  function exportarExcel() {

    if (emprendedores.length === 0) {
      alert("No hay emprendedores registrados para exportar.");
      return;
    }

    let contenido =
      "\uFEFFNombre completo,Número de identidad,Teléfono,Ciudad o aldea,Colonia,Nombre del emprendimiento,Actividad económica,Fecha de registro,Observaciones\n";

    emprendedores.forEach(function(e) {

      const fila = [
        e.nombre || "",
        e.identidad || "",
        e.telefono || "",
        e.municipio || "",
        e.colonia || "",
        e.emprendimiento || "",
        e.rubro || "",
        e.fecha || "",
        e.observaciones || ""
      ];

      contenido += fila.map(function(valor) {
        valor = String(valor).replace(/"/g, '""');
        return '"' + valor + '"';
      }).join(",") + "\n";

    });

    const archivo = new Blob(
      [contenido],
      {
        type: "text/csv;charset=utf-8;"
      }
    );

    const enlace = document.createElement("a");

    enlace.href = URL.createObjectURL(archivo);

    enlace.download =
      "Emprendedores_" +
      fechaHoy() +
      ".csv";

    enlace.click();

    URL.revokeObjectURL(enlace.href);
  }

  // ENTER PARA PASAR AL SIGUIENTE CAMPO
  const camposFormulario = Array.from(
    document.querySelectorAll(
      '#formEmprendedor input:not([type="hidden"]), #formEmprendedor textarea'
    )
  );

  camposFormulario.forEach((campo, indice) => {

    campo.addEventListener("keydown", function(event) {

      if (campo.tagName === "TEXTAREA") {
        return;
      }

      if (event.key === "Enter") {

        event.preventDefault();

        const siguienteCampo =
          camposFormulario[indice + 1];

        if (siguienteCampo) {
          siguienteCampo.focus();
        } else {
          document.getElementById("btnGuardar").focus();
        }
      }

    });

  });

  mostrarEmprendedores();
</script>

</body>
</html>
